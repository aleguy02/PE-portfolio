name: Deploy

on:
  push:
    branches:
      - main
      - testing-github-actions
  workflow_dispatch:

jobs:
  deploy:
    name: 'Deploy to VPS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          cat >> ~/.ssh/config <<END
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}

      - name: Copy redeploy script to VPS
        run: |
          scp -o StrictHostKeyChecking=no scripts/redeploy-site.sh my-vps:~/redeploy-site.sh

      - name: Redeploy Site
        run: |
          ssh my-vps '~/redeploy-site.sh' \
          ssh my-vps 'yes | cp ~/PE-portfolio/scripts/redeploy-site.sh ~/redeploy-site.sh'
